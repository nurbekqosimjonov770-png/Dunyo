<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dunyo 1775</title>
<style>
body{margin:0;background:#0b2a45;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:6px 10px;background:#000a;font-size:13px;z-index:2}
#menu{position:fixed;inset:0;background:#0b1d2e;z-index:5;overflow:auto;text-align:center;padding:15px}
.nb{display:block;margin:6px auto;padding:12px;width:80%;border:0;border-radius:8px;color:#fff;font-size:16px}
#bot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:6px;z-index:2}
#bot button{flex:1;padding:12px;font-size:16px;border:0;border-radius:8px}
canvas{display:block}
</style></head><body>
<div id="top"><span id="info">Davlatni tanlang</span></div>
<canvas id="c"></canvas>
<div id="bot"><button id="zi">+</button><button id="zo">-</button><button id="mu">🎵</button><button id="sp">1x</button></div>
<div id="menu"><h2>Dunyo 1775</h2><p>Davlatingizni tanlang:</p></div>
<script src="map.js"></script>
<script>
const {W,H,g:GR,P,A}=MAP,S=6,TOP=80,np=P.length;
const N={G:["Buyuk Britaniya","#d33",0,52],F:["Fransiya","#36c",2,47],S:["Ispaniya","#e90",-4,40],P:["Portugaliya","#2a6",-8,39],R:["Rossiya","#5a3",37,56],T:["Usmonlilar","#1bb",29,41],H:["Gabsburglar","#ddd",16,48],K:["Prussiya","#668",13,52],N:["Niderlandiya","#f60",5,52],W:["Shvetsiya","#4bd",18,60],C:["Sin (Xitoy)","#fd0",116,40],J:["Yaponiya","#f9c",138,36],I:["Mugallar/Marata","#a5a",78,23],E:["Eron","#8a5",52,33],U:["13 koloniya","#59f",-75,40],Z:["Marokash","#a64",-6,33],D:["Daniya","#c9a",10,56],L:["Polsha-Litva","#ca5",21,52]};
const own=P.map(p=>p[0]),tr=P.map(p=>p[0]==='-'?3+Math.floor(Math.random()*4):6+Math.floor(Math.random()*6));
const cells=P.map(()=>[]);for(let i=0;i<GR.length;i++)if(GR[i]>=0)cells[GR[i]].push(i);
const segs=[];
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const a=GR[y*W+x];if(a<0)continue;
 if(x+1<W){const b=GR[y*W+x+1];if(b>=0&&b!==a)segs.push([x+1,y,0,a,b]);}
 if(y+1<H){const b=GR[(y+1)*W+x];if(b>=0&&b!==a)segs.push([x,y+1,1,a,b]);}}
const cv=document.getElementById('c'),cx=cv.getContext('2d'),info=document.getElementById('info'),menu=document.getElementById('menu');
const oc=document.createElement('canvas');oc.width=W*S;oc.height=H*S;const og=oc.getContext('2d');
let me=null,sc=1,ox=0,oy=0,c0=1,first=1,months=0,speed=1,timer=null,over=false,dirty=false,msg='',mt=0,st=[0,0],LB=[];
function paint(){
 og.clearRect(0,0,oc.width,oc.height);
 for(let p=0;p<np;p++){og.fillStyle=own[p]==='-'?'#7a8a6a':N[own[p]][1];
  for(const c of cells[p])og.fillRect((c%W)*S,((c/W)|0)*S,S,S);}
 for(const s of segs){const w=own[s[3]]!==own[s[4]]?2:1;og.fillStyle=w>1?'#000c':'#0005';
  if(s[2])og.fillRect(s[0]*S,s[1]*S-1,S,w);else og.fillRect(s[0]*S-1,s[1]*S,w,S);}labels();}
function draw(){
 cx.fillStyle='#0b2a45';cx.fillRect(0,0,innerWidth,innerHeight);
 const c=c0*sc;cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
 cx.drawImage(oc,ox,oy,W*c,H*c);
 if(c>=3.2){cx.textAlign='center';cx.textBaseline='middle';cx.font='bold '+Math.min(16,c*2.6)+'px sans-serif';cx.lineWidth=3;cx.strokeStyle='#000b';cx.fillStyle='#fff';
  for(let p=0;p<np;p++){const x=ox+(P[p][1]+.5)*c,y=oy+(P[p][2]+.5)*c;if(x<-20||y<-20||x>innerWidth+20||y>innerHeight+20)continue;cx.strokeText(tr[p],x,y);cx.fillText(tr[p],x,y);}}
 if(c<7){cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=3;cx.strokeStyle='#000c';cx.fillStyle='#fff';
  for(const L of LB){const nm=N[L[0]][0].toUpperCase(),f=Math.min(26,Math.sqrt(L[3]*55)*c*.8/(.68*nm.length));if(f<9)continue;
   const x=ox+(L[1]+.5)*c,y=oy+(L[2]+.5)*c;if(x<-50||y<-50||x>innerWidth+50||y>innerHeight+50)continue;
   cx.font='bold '+f+'px sans-serif';cx.strokeText(nm,x,y);cx.fillText(nm,x,y);}}}
function fit(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';cx.setTransform(d,0,0,d,0,0);
 c0=innerWidth/W;if(first){oy=(innerHeight-H*c0)/2;first=0;}draw();}
function hud(){if(!me)return;info.textContent=Date.now()<mt?msg:N[me][0]+" | "+(1775+Math.floor(months/12))+"-yil, "+(months%12+1)+"-oy | Viloyat: "+st[0]+"/"+np+" | Qo'shin: "+st[1];}
function note(t){msg=t;mt=Date.now()+2500;hud();}
function attack(a,d){const t=tr[a];if(t<3){note("Qo'shin kam");return;}
 const send=Math.floor(t*.7);tr[a]=t-send;const att=send*(.9+Math.random()*.4),df=tr[d]*(1+.2*Math.random());
 if(att>df){own[d]=own[a];tr[d]=Math.max(1,Math.floor(send-df*.6));dirty=true;}else tr[d]=Math.max(1,Math.floor(tr[d]-att*.6));}
function tap(px,py){if(!me||over)return;const c=c0*sc,x=Math.floor((px-ox)/c),y=Math.floor((py-oy)/c);
 if(x<0||y<0||x>=W||y>=H)return;const d=GR[y*W+x];if(d<0)return;
 if(own[d]===me){note("Sizning viloyat: "+tr[d]+" qo'shin");return;}
 let b=-1;for(const a of A[d])if(own[a]===me&&(b<0||tr[a]>tr[b]))b=a;
 if(b<0){note("Chegaradan uzoq!");return;}
 attack(b,d);if(dirty){paint();dirty=false;}draw();hud();}
function tick(){if(over)return;months++;
 const cnt={};
 for(let p=0;p<np;p++){const o=own[p];if(o==='-'){if(tr[p]<12&&Math.random()<.1)tr[p]++;}else{cnt[o]=(cnt[o]||0)+1;if(tr[p]<40&&Math.random()<.3)tr[p]++;}}
 const cand={};
 for(let p=0;p<np;p++){const o=own[p];if(o==='-'||o===me||tr[p]<6)continue;let tg=-1,tm=999;
  for(const q of A[p]){if(own[q]!==o&&tr[q]<tm){tm=tr[q];tg=q;}}
  if(tg>=0&&tr[p]*.7>tm*1.1)(cand[o]=cand[o]||[]).push([p,tg]);}
 for(const o in cand){const n=1+Math.floor(cnt[o]/20);for(let i=0;i<n;i++){if(Math.random()<.5){const a=cand[o],m=a[Math.floor(Math.random()*a.length)];if(own[m[0]]===o&&own[m[1]]!==o)attack(m[0],m[1]);}}}
 if(dirty){paint();dirty=false;}
 let m=0,a=0;for(let p=0;p<np;p++)if(own[p]===me){m++;a+=tr[p];}st=[m,a];
 if(m===0){over=true;msg="Yutqazdingiz!";mt=1e15;}else if(m>np*.5){over=true;msg="G'alaba! Dunyo sizniki!";mt=1e15;}
 hud();draw();}
function start(){clearInterval(timer);timer=setInterval(tick,1000/speed);}
function zoomAt(x,y,k){const ns=Math.min(16,Math.max(1,sc*k));k=ns/sc;ox=x-(x-ox)*k;oy=y-(y-oy)*k;sc=ns;draw();}
document.getElementById('sp').onclick=e=>{speed=speed===1?2:speed===2?4:1;e.target.textContent=speed+"x";if(me)start();};
document.getElementById('zi').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.5);
document.getElementById('zo').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.5);
const ptr=new Map();let pd=0,mv=false,s0=[0,0];
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);mv=false;s0=[e.clientX,e.clientY];pd=0;});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
 if(ptr.size===1){if(Math.abs(e.clientX-s0[0])+Math.abs(e.clientY-s0[1])>8)mv=true;if(mv){ox+=e.clientX-o[0];oy+=e.clientY-o[1];draw();}}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===2){mv=true;const v=[...ptr.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);if(pd)zoomAt((v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2,d/pd);pd=d;}});
cv.addEventListener('pointerup',e=>{const was=ptr.size===1&&!mv;ptr.delete(e.pointerId);pd=0;if(was)tap(e.clientX,e.clientY);});
cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);pd=0;});
function center(k){sc=5;const c=c0*sc;ox=innerWidth/2-(N[k][2]+180+.5)*c;oy=innerHeight/2-(TOP-N[k][3]+.5)*c;draw();}
for(const k in N){const b=document.createElement('button');b.className='nb';b.style.background=N[k][1];
 const h=N[k][1],l=parseInt(h[1],16)*3+parseInt(h[2],16)*6+parseInt(h[3],16);if(l>90)b.style.color='#000';
 b.textContent=N[k][0];b.onclick=()=>{me=k;menu.style.display='none';center(k);start();tick();music();};menu.appendChild(b);}
function labels(){const seen=new Uint8Array(np);LB=[];
 for(let p=0;p<np;p++){if(seen[p]||own[p]==='-')continue;const o=own[p],q=[p];seen[p]=1;
  for(let i=0;i<q.length;i++)for(const n of A[q[i]])if(!seen[n]&&own[n]===o){seen[n]=1;q.push(n);}
  if(q.length<3)continue;let mx=0,my=0;for(const k of q){mx+=P[k][1];my+=P[k][2];}mx/=q.length;my/=q.length;
  let b=q[0],bd=1e9;for(const k of q){const d=(P[k][1]-mx)**2+(P[k][2]-my)**2;if(d<bd){bd=d;b=k;}}
  LB.push([o,P[b][1],P[b][2],q.length]);}}
let ac=null,mg=null,mOn=true,nT=0,sP=0;
function tone(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05);}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.3);}
function snare(t){const n=(ac.sampleRate*.15)|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const u=ac.createBufferSource(),g=ac.createGain();u.buffer=b;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);u.connect(g);g.connect(mg);u.start(t);}
const CH=[[62,65,69],[58,62,65],[60,64,67],[57,61,64]],BS=[38,34,36,33];
const ML=[[74,0,77,0,81,0,79,77],[77,0,74,0,70,0,72,74],[76,0,79,0,84,0,83,81],[81,0,79,0,77,0,76,73]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function sched(){while(nT<ac.currentTime+.3){const bar=(sP>>3)&3,s=sP&7,sd=.3125;
 if(s===0){CH[bar].forEach(m=>tone(mf(m),nT,sd*7,'sawtooth',.025));}
 if(s===0||s===4)tone(mf(BS[bar]),nT,sd*3.5,'triangle',.2);
 const m=ML[bar][s];if(m)tone(mf(m),nT,sd*1.8,'square',.04);
 if(s===0||s===4)kick(nT);if(s===2||s===6)snare(nT);
 nT+=sd;sP++;}}
function music(){if(!mOn)return;if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;mg.connect(lp);lp.connect(ac.destination);nT=ac.currentTime+.1;setInterval(sched,100);}if(ac.state==='suspended')ac.resume();}
document.getElementById('mu').onclick=e=>{mOn=!mOn;e.target.textContent=mOn?'🎵':'🔇';if(mOn)music();else if(ac)ac.suspend();};
window.addEventListener('resize',fit);fit();paint();draw();
</script></body></html>
