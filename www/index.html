<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dunyo tarixi</title>
<style>
body{margin:0;background:#0b2a45;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;padding:6px 10px;background:#000a;font-size:13px;z-index:2}
#menu{position:fixed;inset:0;background:#0b1d2e;z-index:5;overflow:auto;text-align:center;padding:15px}
.nb{display:block;margin:6px auto;padding:12px;width:80%;border:0;border-radius:8px;color:#fff;font-size:16px}
#bot{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:6px;z-index:2}
#bot button{flex:1;padding:12px;font-size:16px;border:0;border-radius:8px}
#pn{position:fixed;bottom:56px;left:0;right:0;padding:8px;background:#000c;z-index:2;display:none;text-align:center;font-size:14px}
canvas{display:block}
#menu.hold{visibility:hidden}
body.boot #top,body.boot #bot,body.boot canvas,body.boot #pn{visibility:hidden}
#splash{position:fixed;inset:0;background:#0b1d2e;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .25s}
#splash h1{margin:0 0 18px;font-size:30px;letter-spacing:1px}
#splash .bar{width:46%;max-width:260px;height:6px;background:#fff2;border-radius:3px;overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;background:#fc6;border-radius:3px;animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
#splash small{margin-top:12px;opacity:.7}
</style></head><body class="boot">
<div id="splash"><h1>🌍 Dunyo tarixi</h1><div class="bar"><i></i></div><small>Yuklanmoqda...</small></div>
<script>window.__ready=function(){if(window.__rd)return;window.__rd=1;var m=document.getElementById('menu');if(m)m.classList.remove('hold');document.body.classList.remove('boot');var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){s.remove();},300);}};window.addEventListener('load',function(){setTimeout(window.__ready,40);});setTimeout(window.__ready,9000);</script>
<div id="top"><span id="info">Davlatni tanlang</span></div>
<canvas id="c"></canvas>
<div id="pn"></div>
<div id="bot"><button id="hm">🏠</button><button id="zi">+</button><button id="zo">-</button><button id="bz">💱</button><button id="mu">🎵</button><button id="sp">1x</button></div>
<div id="menu" class="hold"><h2>Dunyo tarixi</h2><p>Davrni tanlang:</p></div>
<script src="map.js"></script>
<script src="eras2.js"></script>
<script src="eras3.js"></script>
<script src="eras4.js"></script>
<script src="eras5.js"></script>
<script src="eras.js"></script>
<script src="art.js"></script>

</body></html>
